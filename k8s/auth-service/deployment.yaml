apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: placeholder-image # Atualizado automaticamente pela esteira de CI
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feature-flags-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: AUTH_DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: DB_NAME_AUTH
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)?sslmode=disable"
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: feature-flags-secrets
                  key: MASTER_KEY
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

