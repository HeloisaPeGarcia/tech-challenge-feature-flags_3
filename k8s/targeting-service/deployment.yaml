apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels:
    app: targeting-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
        - name: targeting-service
          image: placeholder-image
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feature-flags-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: TARGETING_DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: DB_NAME_TARGETING
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: feature-flags-config
                  key: AUTH_SERVICE_URL
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

