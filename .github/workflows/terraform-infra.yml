name: Terraform Infrastructure IaC

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform a ser executada'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      use_aws_academy:
        description: 'Usar ambiente AWS Academy (LabRole)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: togglemaster-tfstate-${{ github.repository_owner }}
  TF_LOCK_TABLE: terraform-lock-table

jobs:
  terraform:
    name: 'Terraform IaC — ${{ github.event.inputs.action }}'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_PAT }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ─── PRÉ-REQUISITO: Garantir que o Bucket S3 existe ──────────────────
      # Esse é o único recurso que o Terraform não consegue criar antes de
      # si mesmo. O AWS CLI cria apenas se ainda não existir.
      - name: Criar bucket S3 para o Terraform State (se não existir)
        if: github.event.inputs.action != 'destroy'
        run: |
          echo "Verificando bucket S3: ${{ env.TF_STATE_BUCKET }}"
          if aws s3api head-bucket --bucket ${{ env.TF_STATE_BUCKET }} 2>/dev/null; then
            echo "✅ Bucket já existe, pulando criação."
          else
            echo "🪣 Criando bucket S3..."
            aws s3api create-bucket \
              --bucket ${{ env.TF_STATE_BUCKET }} \
              --region ${{ env.AWS_REGION }}
            aws s3api put-bucket-versioning \
              --bucket ${{ env.TF_STATE_BUCKET }} \
              --versioning-configuration Status=Enabled
            echo "✅ Bucket criado com versionamento habilitado."
          fi

      - name: Criar tabela DynamoDB para lock do Terraform (se não existir)
        if: github.event.inputs.action != 'destroy'
        run: |
          echo "Verificando tabela DynamoDB: ${{ env.TF_LOCK_TABLE }}"
          if aws dynamodb describe-table --table-name ${{ env.TF_LOCK_TABLE }} 2>/dev/null; then
            echo "✅ Tabela de lock já existe."
          else
            echo "🔒 Criando tabela de lock DynamoDB..."
            aws dynamodb create-table \
              --table-name ${{ env.TF_LOCK_TABLE }} \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name ${{ env.TF_LOCK_TABLE }}
            echo "✅ Tabela de lock criada."
          fi

      # ─── TERRAFORM INIT ───────────────────────────────────────────────────
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      # ─── TERRAFORM PLAN ───────────────────────────────────────────────────
      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: |
          terraform plan \
            -var="use_aws_academy=${{ github.event.inputs.use_aws_academy }}"

      # ─── TERRAFORM APPLY ──────────────────────────────────────────────────
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          terraform apply \
            -auto-approve \
            -var="use_aws_academy=${{ github.event.inputs.use_aws_academy }}"

      # ─── PÓS-APPLY: Capturar Outputs e Atualizar ConfigMap ──────────────
      # Após criar a infraestrutura, injeta automaticamente os endpoints
      # reais do RDS, Redis e SQS no arquivo k8s/shared-resources.yaml
      - name: Capturar Outputs do Terraform
        if: github.event.inputs.action == 'apply'
        id: tf-outputs
        run: |
          RDS_AUTH=$(terraform output -raw rds_auth_endpoint | sed 's/:5432//')
          RDS_FLAGS=$(terraform output -raw rds_flags_endpoint | sed 's/:5432//')
          RDS_TARGETING=$(terraform output -raw rds_targeting_endpoint | sed 's/:5432//')
          REDIS_HOST=$(terraform output -raw redis_primary_endpoint)
          SQS_URL=$(terraform output -raw sqs_queue_url)

          echo "rds_auth=$RDS_AUTH" >> $GITHUB_OUTPUT
          echo "rds_flags=$RDS_FLAGS" >> $GITHUB_OUTPUT
          echo "rds_targeting=$RDS_TARGETING" >> $GITHUB_OUTPUT
          echo "redis_host=$REDIS_HOST" >> $GITHUB_OUTPUT
          echo "sqs_url=$SQS_URL" >> $GITHUB_OUTPUT

          echo "✅ Outputs capturados:"
          echo "  RDS Auth:      $RDS_AUTH"
          echo "  RDS Flags:     $RDS_FLAGS"
          echo "  RDS Targeting: $RDS_TARGETING"
          echo "  Redis:         $REDIS_HOST"
          echo "  SQS:           $SQS_URL"

      - name: Atualizar ConfigMap com endpoints reais (shared-resources.yaml)
        if: github.event.inputs.action == 'apply'
        working-directory: .
        run: |
          sed -i "s|AUTH_DB_HOST:.*|AUTH_DB_HOST: \"${{ steps.tf-outputs.outputs.rds_auth }}\"|" k8s/shared-resources.yaml
          sed -i "s|FLAGS_DB_HOST:.*|FLAGS_DB_HOST: \"${{ steps.tf-outputs.outputs.rds_flags }}\"|" k8s/shared-resources.yaml
          sed -i "s|TARGETING_DB_HOST:.*|TARGETING_DB_HOST: \"${{ steps.tf-outputs.outputs.rds_targeting }}\"|" k8s/shared-resources.yaml
          sed -i "s|REDIS_HOST:.*|REDIS_HOST: \"${{ steps.tf-outputs.outputs.redis_host }}\"|" k8s/shared-resources.yaml
          sed -i "s|AWS_SQS_URL:.*|AWS_SQS_URL: \"${{ steps.tf-outputs.outputs.sqs_url }}\"|" k8s/shared-resources.yaml

          echo "✅ ConfigMap atualizado:"
          cat k8s/shared-resources.yaml

      - name: Commit e push do ConfigMap atualizado
        if: github.event.inputs.action == 'apply'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/shared-resources.yaml
          git diff --staged --quiet || git commit -m "chore(infra): atualiza ConfigMap com endpoints reais do Terraform [skip ci]"
          git push https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/${{ github.repository }}.git HEAD:main

      # ─── PÓS-APPLY: Configurar kubectl + Instalar ArgoCD + Aplicar Apps ──
      - name: Instalar kubectl
        if: github.event.inputs.action == 'apply'
        uses: azure/setup-kubectl@v4

      - name: Configurar acesso ao cluster EKS
        if: github.event.inputs.action == 'apply'
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name dev-cluster
          kubectl get nodes

      # ─── PÓS-APPLY: Rodar migrations de banco de dados ───────────────────
      # O RDS é criado vazio. Os scripts init.sql criam as tabelas necessárias.
      # psql conecta diretamente nos endpoints do RDS (acessível da subnet pública
      # do runner do GitHub Actions via Security Group com 0.0.0.0/0 na porta 5432).
      - name: Instalar cliente psql
        if: github.event.inputs.action == 'apply'
        run: sudo apt-get install -y postgresql-client

      - name: Rodar migration do auth-service (RDS Auth)
        if: github.event.inputs.action == 'apply'
        env:
          PGPASSWORD: "SuperSecurePassword123!"
        run: |
          psql \
            -h ${{ steps.tf-outputs.outputs.rds_auth }} \
            -U dbadmin \
            -d auth_db \
            -f auth-service/db/init.sql
          echo "✅ Migration auth_db concluída!"

      - name: Rodar migration do flag-service (RDS Flags)
        if: github.event.inputs.action == 'apply'
        env:
          PGPASSWORD: "SuperSecurePassword123!"
        run: |
          psql \
            -h ${{ steps.tf-outputs.outputs.rds_flags }} \
            -U dbadmin \
            -d flags_db \
            -f flag-service/db/init.sql
          echo "✅ Migration flags_db concluída!"

      - name: Rodar migration do targeting-service (RDS Targeting)
        if: github.event.inputs.action == 'apply'
        env:
          PGPASSWORD: "SuperSecurePassword123!"
        run: |
          psql \
            -h ${{ steps.tf-outputs.outputs.rds_targeting }} \
            -U dbadmin \
            -d targeting_db \
            -f targeting-service/db/init.sql
          echo "✅ Migration targeting_db concluída!"

      - name: Instalar ArgoCD no cluster EKS
        if: github.event.inputs.action == 'apply'
        run: |
          # Cria o namespace se não existir
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          
          # Instala o ArgoCD
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          
          # Aguarda os pods ficarem prontos (timeout 5 minutos)
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=argocd-server \
            -n argocd \
            --timeout=300s
          
          echo "✅ ArgoCD instalado!"

      - name: Expor ArgoCD via LoadBalancer
        if: github.event.inputs.action == 'apply'
        run: |
          kubectl patch svc argocd-server -n argocd \
            -p '{"spec": {"type": "LoadBalancer"}}'
          
          # Aguarda o endereço externo (até 3 minutos)
          echo "Aguardando LoadBalancer..."
          for i in {1..18}; do
            LB=$(kubectl get svc argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            if [ -n "$LB" ]; then
              echo "✅ ArgoCD disponível em: https://$LB"
              echo "argocd_url=https://$LB" >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 10
          done

      - name: Criar namespace dos microsserviços
        if: github.event.inputs.action == 'apply'
        run: |
          kubectl create namespace togglemaster --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar ConfigMap e Secrets no cluster
        if: github.event.inputs.action == 'apply'
        run: |
          kubectl apply -f k8s/shared-resources.yaml -n togglemaster
          echo "✅ ConfigMap e Secrets aplicados!"

      - name: Aplicar as 5 ArgoCD Applications
        if: github.event.inputs.action == 'apply'
        run: |
          kubectl apply -f argocd/
          echo "✅ ArgoCD Applications aplicadas! Aguardando sync..."

      - name: Exibir senha inicial do ArgoCD
        if: github.event.inputs.action == 'apply'
        run: |
          echo "🔑 Senha inicial do ArgoCD admin:"
          kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d
          echo ""

      - name: Resumo do Deploy
        if: github.event.inputs.action == 'apply'
        run: |
          echo "## ✅ Infraestrutura criada com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Recurso | Endpoint |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Auth | ${{ steps.tf-outputs.outputs.rds_auth }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Flags | ${{ steps.tf-outputs.outputs.rds_flags }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Targeting | ${{ steps.tf-outputs.outputs.rds_targeting }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Redis | ${{ steps.tf-outputs.outputs.redis_host }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SQS | ${{ steps.tf-outputs.outputs.sqs_url }} |" >> $GITHUB_STEP_SUMMARY

      # ─── TERRAFORM DESTROY ────────────────────────────────────────────────
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy \
            -auto-approve \
            -var="use_aws_academy=${{ github.event.inputs.use_aws_academy }}"
