          | RDS Targeting | \`${{ env.TARGETING_DB_HOST }}\` |
          | Redis ElastiCache | \`${{ env.REDIS_HOST }}\` |
          | SQS | \`${{ env.SQS_URL }}\` |
          | DynamoDB | \`${{ env.DYNAMODB_TABLE }}\` |

          ### Resultado dos Testes
